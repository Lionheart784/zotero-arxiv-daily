zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  # 推荐 arXiv 论文时，以「已读/CDS560」分类里的文献作为兴趣基准
  include_path: ["已读/CDS560", "已读/CDS560/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.decode:${oc.env:SMTP_PORT,465}}
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  generation_kwargs:
    # 小米 MiMo：flash 最便宜，写一句话 TL;DR 足够
    model: ${oc.env:LLM_MODEL,mimo-v2.6-flash}
    max_tokens: null # MiMo 文档使用 max_completion_tokens
    max_completion_tokens: 512
    extra_body:
      thinking:
        type: disabled # MiMo 默认开启思考模式，会多耗很多 token
  language: Chinese

source:
  arxiv:
    category: ["cs.AI", "cs.CL", "cs.HC", "cs.MA"]
    include_cross_list: true

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
  max_paper_num: 20
  send_empty: true # 没有新论文、新被引的日子也发一封，方便确认运行正常

venue_filter:
  enabled: true
  ccf_min: C
  sjr_min: Q3
  keep_unrated: true

citation_alert:
  enabled: true
  include_path: ["已读/CDS560", "已读/CDS560/**"]
  venue_filter: true
