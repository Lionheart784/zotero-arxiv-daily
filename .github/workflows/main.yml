name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 06:00 Hong Kong time
    - cron: '0 22 * * *'

permissions:
  contents: write # commit the citation state and refreshed CCF/SJR snapshots

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          # Optional (repository variables or secrets)
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          # Empty optional variables must not override the config defaults
          for v in SMTP_SERVER SMTP_PORT LLM_MODEL S2_API_KEY OPENALEX_API_KEY OPENALEX_MAILTO; do
            if [ -z "${!v}" ]; then unset $v; fi
          done
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          else
            cp config/user_config.yaml config/custom.yaml
          fi
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save citation state and data snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to save"
          else
            git commit -m "chore: update citation state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
